<!DOCTYPE html>
<html lang="en">
<head>
    <title>Caesar Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
    <div class="container mt-5">
        <table class="table table-bordered">
            <thead>
                <tr><th style="text-align: center; font-weight: bold; font-size: 25px;">CAESAR CIPHER</th></tr>
            </thead>
            <tbody>
                <tr><td style="font-weight: bold; color: blue">ENCRYPTION</td></tr>
                <tr>
                    <td>
                        <form method="POST" action="/encrypt">
                            <div class="mb-3">
                                <label class="form-label">Plain text:</label>
                                <input type="text" class="form-control" name="inputPlainText" value="{{ old_txt_en or '' }}" placeholder="Input Plain Text" required autofocus/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Key:</label>
                                <input type="number" class="form-control" name="inputKeyPlain" value="{{ old_key_en or '' }}" placeholder="Input Key" required/>
                            </div>
                            <button type="submit" class="btn btn-primary">Encrypt</button>
                        </form>

                        {% if res_en %}
                        <div class="alert alert-primary mt-3">
                            <strong>Kết quả mã hóa:</strong> {{ res_en }}
                        </div>
                        {% endif %}
                    </td>
                </tr>

                <tr><td style="font-weight: bold; color: green">DECRYPTION</td></tr>
                <tr>
                    <td>
                        <form method="POST" action="/decrypt">
                            <div class="mb-3">
                                <label class="form-label">Cipher text:</label>
                                <input type="text" class="form-control" name="inputCipherText" value="{{ old_txt_de or '' }}" placeholder="Input Cipher Text" required/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Key:</label>
                                <input type="number" class="form-control" name="inputKeyCipher" value="{{ old_key_de or '' }}" placeholder="Input Key" required/>
                            </div>
                            <button type="submit" class="btn btn-success">Decrypt</button>
                        </form>

                        {% if res_de %}
                        <div class="alert alert-success mt-3">
                            <strong>Kết quả giải mã:</strong> {{ res_de }}
                        </div>
                        {% endif %}
                    </td>
                </tr>
                <tr>
                    <td align="center"><a href="/" class="btn btn-link">Quay lại trang chủ</a></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
